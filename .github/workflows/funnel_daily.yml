# Daily funnel report -- only deliverable per Nahua rule for next 2 weeks
# v1 | 2026-05-17 | Job_PM [V8 SHADOW]
#
# Pulls Supabase funnel metrics + experiment deltas + emails to faculavino@gmail.com.
# If SMTP secrets aren't set, prints to workflow log only (no email).
#
# Required secrets (in addition to D0's SUPABASE_URL + SUPABASE_SERVICE_KEY):
#   BREVO_API_KEY -- pulled from existing Vercel env (Facu has had Brevo for marketing 67d+)
#
# Optional secrets:
#   REPORT_TO        -- recipient (default: faculavino@gmail.com)
#   REPORT_FROM      -- sender email (default: facu@floropolis.com -- must be verified in Brevo)
#   REPORT_FROM_NAME -- sender display name (default: "Floropolis BI")

name: Funnel daily

on:
  schedule:
    # Daily at 13:00 UTC = 06:00 PDT
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  funnel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run funnel pull + email
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
          REPORT_FROM_NAME: ${{ secrets.REPORT_FROM_NAME }}
        run: python scripts/reports/funnel_daily.py
