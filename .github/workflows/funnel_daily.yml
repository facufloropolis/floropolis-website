# Weekly funnel digest -- D0 cron per master_plan.md KPI #2
# v2 | 2026-05-28 | Job_PM [V8 SHADOW]
#
# Pulls Supabase funnel metrics (L7/P7) + experiment deltas + emails to faculavino@gmail.com.
# Runs Monday 06:00 PDT (13:00 UTC). If BREVO_API_KEY not set, prints to log only.
#
# Required secrets:
#   SUPABASE_URL         -- main project: https://swhglnjyuorkycpgkmec.supabase.co
#   SUPABASE_SERVICE_KEY -- service role key for main project (or anon key -- execute_sql is public)
#   BREVO_API_KEY        -- Brevo transactional API key (from Vercel env)
#
# Optional secrets:
#   REPORT_TO        -- recipient (default: faculavino@gmail.com)
#   REPORT_FROM      -- sender email (default: facu@floropolis.com -- must be verified in Brevo)
#   REPORT_FROM_NAME -- sender display name (default: "Floropolis BI")

name: Funnel weekly digest

on:
  schedule:
    # Every Monday at 13:00 UTC = 06:00 PDT
    - cron: '0 13 * * 1'
  workflow_dispatch:

jobs:
  funnel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run funnel pull + email
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
          REPORT_FROM_NAME: ${{ secrets.REPORT_FROM_NAME }}
        run: python scripts/reports/funnel_daily.py
