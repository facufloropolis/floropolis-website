# CI quality workflow -- J.4 (code quality) + J.5 (brand voice compliance) made real
# v1 | 2026-05-17 | Job_PM [V8 SHADOW]
#
# Runs on every PR + push to main. Three checks:
#   1. tsc --noEmit         (type errors)
#   2. eslint (next lint)   (lint errors)
#   3. brand voice lint     (ASCII rule + never-say list)
#
# Current posture:
#   - tsc + eslint: BLOCKING (fail = no merge)
#   - brand voice: WARNING (continue-on-error) until baseline is cleaned up
#
# Per kb/brand_voice.md: 7 existing violations on customer-facing code
# (Farm Direct + Shop Now). Flip brand-voice to blocking after they're fixed.

name: Quality (J.4 + J.5)

on:
  push:
    branches: ['**']   # ALL branches — catches TS errors before Vercel tries to build
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: TypeScript check (J.4 -- BLOCKING)
        run: npx tsc --noEmit

      - name: PROD write boundary (admin_backup Phase 0 -- BLOCKING, DECISION_LOCK_003)
        # Guard contra regresiones: ningún path de /admin puede escribir a PROD.
        # Stdlib-only, ya PASS en main (2026-06-01). Un fail = un write a PROD reintroducido.
        run: python3 scripts/verify_prod_write_boundary.py

      - name: Admin surface truth (Bet #1 Phase C1 -- BLOCKING)
        # Diffs every admin/storefront-displayed number against its source-of-truth
        # query (catalog_published authority per D01). A FAIL = a surface is lying
        # (stale classifications, ghost gates, storefront drift). Charter evidence
        # standard enforced by pipeline, not by promise. Step skips only when BACKUP
        # secrets are absent (e.g. fork PRs) via the env guard inside the script call.
        env:
          BACKUP_SUPABASE_URL: ${{ secrets.BACKUP_SUPABASE_URL }}
          BACKUP_SUPABASE_SERVICE_KEY: ${{ secrets.BACKUP_SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$BACKUP_SUPABASE_URL" ]; then echo "BACKUP secrets absent — skipping (fork PR)"; exit 0; fi
          node scripts/verify_admin_surface_truth.mjs

      - name: ESLint (J.4 -- WARNING for first run until local install issue verified)
        continue-on-error: true
        run: npm run lint

      - name: Brand voice lint (J.5 -- WARNING until 7 existing violations cleaned up)
        continue-on-error: true
        run: bash scripts/quality/lint_brand_voice.sh
